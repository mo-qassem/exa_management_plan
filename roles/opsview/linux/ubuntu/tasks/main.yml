---
- name: Ensure the Ansible tmp directory exists
  become: true
  ansible.builtin.file:
    path: /home/exadmn/.ansible/tmp
    state: directory
    mode: "0755"
    owner: exadmn
    group: exadmn


- name: Download Opsview Agent Debian package
  become: true
  ansible.builtin.get_url:
    url: https://box119.exaservers.com/exa_ansible/opsview-agent-debian.deb
    dest: /tmp/opsview-agent-debian.deb
    mode: "0644"

- name: Check libssl1.1 package status
  become: true
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - "-f=${db:Status-Status}"
      - libssl1.1
  register: libssl_status
  changed_when: false
  failed_when: false
  when:
    - ansible_distribution == "Ubuntu"
    - ansible_distribution_version in ['22.04', '24.04', '26.04']
    - ansible_architecture == "x86_64"


- name: Download libssl1.1 compatibility package
  become: true
  ansible.builtin.get_url:
    url: https://box119.exaservers.com/exa_ansible/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb
    dest: /tmp/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb
    mode: "0644"
  when:
    - ansible_distribution == "Ubuntu"
    - ansible_distribution_version in ['22.04', '24.04', '26.04']
    - ansible_architecture == "x86_64"
    - libssl_status.stdout | default('') | trim != 'installed'


- name: Install libssl1.1 compatibility package
  become: true
  ansible.builtin.apt:
    deb: /tmp/libssl1.1_1.1.1f-1ubuntu2.24_amd64.deb
    state: present
  when:
    - ansible_distribution == "Ubuntu"
    - ansible_distribution_version in ['22.04', '24.04', '26.04']
    - ansible_architecture == "x86_64"
    - libssl_status.stdout | default('') | trim != 'installed'


- name: Verify libssl1.1 installation
  become: true
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - "-f=${db:Status-Status}"
      - libssl1.1
  register: libssl_verify
  changed_when: false
  when:
    - ansible_distribution == "Ubuntu"
    - ansible_distribution_version in ['22.04', '24.04', '26.04']
    - ansible_architecture == "x86_64"


- name: Ensure libssl1.1 is installed
  ansible.builtin.assert:
    that:
      - libssl_verify.stdout | trim == 'installed'
    fail_msg: "libssl1.1 compatibility package installation failed."
  when:
    - ansible_distribution == "Ubuntu"
    - ansible_distribution_version in ['22.04', '24.04', '26.04']
    - ansible_architecture == "x86_64"


- name: Check Opsview Agent package status
  become: true
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - "-f=${db:Status-Status}"
      - opsview-agent
  register: opsview_package_status
  changed_when: false
  failed_when: false

- name: Install Opsview Agent Debian package
  become: true
  ansible.builtin.apt:
    deb: /tmp/opsview-agent-debian.deb
    state: present
  when:
    - opsview_package_status.rc != 0
      or opsview_package_status.stdout | trim != 'installed'


- name: Check Opsview Agent package status after installation
  become: true
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - "-f=${db:Status-Status}"
      - opsview-agent
  register: opsview_package_status_after
  changed_when: false
  failed_when: false


- name: Configure Opsview Agent if not already configured
  become: true
  ansible.builtin.command:
    argv:
      - dpkg
      - --configure
      - opsview-agent
  register: opsview_configure
  when:
    - opsview_package_status_after.rc == 0
    - opsview_package_status_after.stdout | trim != 'installed'
  changed_when: true

- name: Add special permissions to Opsview sudoers
  become: true
  ansible.builtin.blockinfile:
    path: /etc/sudoers
    insertafter: "^## Allows members of the users group to shutdown this system"
    block: |
      opsview ALL=NOPASSWD:/usr/sbin/exim
      opsview ALL=NOPASSWD:/usr/sbin/csf
      opsview ALL=NOPASSWD:/usr/sbin/lfd
      opsview ALL=NOPASSWD:/usr/bin/omreport
      opsview ALL=NOPASSWD:/opt/opsview/agent/plugins/check_tcp
      opsview ALL=NOPASSWD:/opt/opsview/agent/plugins/check_disk
      opsview ALL=NOPASSWD:/opt/opsview/agent/plugins/check_csf
    create: true
    validate: '/usr/sbin/visudo -cf %s'


- name: Copy NRPE configuration file
  become: true
  ansible.builtin.template:
    src: files/opsview/nrpe.cfg.j2
    dest: /opt/opsview/agent/etc/nrpe.cfg
    owner: root
    group: root
    mode: "0644"
  notify: Restart Opsview Agent

- name: Copy check_bandwidth_quota
  become: true
  ansible.builtin.template:
    src: files/opsview/check_bandwidth_quota.sh.j2
    dest: /opt/opsview/agent/plugins/check_bandwidth_quota.sh
    owner: root
    group: opsview
    mode: "0750"


- name: Copy check_csf
  become: true
  ansible.builtin.copy:
    src: files/opsview/check_csf
    dest: /opt/opsview/agent/plugins/check_csf
    owner: root
    group: opsview
    mode: "0750"


- name: Copy check_eximmailqueue
  become: true
  ansible.builtin.copy:
    src: files/opsview/check_eximmailqueue
    dest: /opt/opsview/agent/plugins/check_eximmailqueue
    owner: root
    group: opsview
    mode: "0750"


- name: Copy check_Raid
  become: true
  ansible.builtin.copy:
    src: files/opsview/check_raid.pl
    dest: /opt/opsview/agent/plugins/check_raid.pl
    owner: root
    group: opsview
    mode: "0750"

- name: Ensure Opsview Agent is enabled and running
  become: true
  ansible.builtin.systemd:
    name: opsview-agent.service
    state: started
    enabled: true

- name: Check Opsview Agent service status
  become: true
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - opsview-agent.service
  register: opsview_service_status
  changed_when: false
  failed_when: opsview_service_status.stdout | trim != 'active'

- name: Display Opsview Agent status
  ansible.builtin.debug:
    msg: "Opsview Agent is successfully installed and running on {{ inventory_hostname }}."
