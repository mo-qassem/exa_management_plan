---

- name: Check whether UFW is installed
  become: true
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - -f=${db:Status-Status}
      - ufw
  register: ufw_package_status
  changed_when: false
  failed_when: false

- name: Install UFW if not installed
  become: true
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
  when: >-
    ansible_distribution == "Ubuntu" and
    (ufw_package_status.rc != 0 or
    ufw_package_status.stdout | trim != "installed")

- name: Check if UFW service is active
  become: true
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - ufw.service
  register: ufw_status
  changed_when: false
  failed_when: false

- name: Set fact if UFW service is running
  ansible.builtin.set_fact:
    ufw_installed: "{{ ufw_status.rc == 0 }}"

- name: Print the result
  ansible.builtin.debug:
    msg: "UFW service active: {{ ufw_installed }}"

- name: Ensure UFW service is enabled and running
  become: true
  ansible.builtin.systemd:
    name: ufw.service
    state: started
    enabled: true
  when: ansible_distribution == "Ubuntu"

- name: Allow 'Opsview' and 'Bareos' IPs through UFW
  community.general.ufw:
    rule: allow
    from_ip: "{{ item.source }}"
  loop:
    - { source: "85.17.194.5/32" }
    - { source: "94.75.230.111/32" }
    - { source: "212.83.154.138/32" }
    - { source: "62.210.6.242/32" }
  notify: Reload ufw Service

- name: Allow 'Opsview', 'Bareos', and 'SSH' Ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - 5666
    - 9101:9103
    - 2662
    - 31262
  when: not prof_mgmt | bool
  notify: Reload ufw Service

- name: Allow 'Opsview', 'Acronis', and 'SSH' Ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - 5666
    - 2662
    - 31262
    - 8443
    - 9850
    - 9851
    - 44445
    - 55556
    - 7778
    - 7779
    - 7770:7800
  when: prof_mgmt | bool
  notify: Reload ufw Service

- name: Allow 'Acronis' IPs through UFW
  community.general.ufw:
    rule: allow
    from_ip: "{{ item.source }}"
  loop:
    - { source: "45.11.129.21/32" }
    - { source: "45.11.129.22/32" }
    - { source: "185.174.141.22/32" }
  when: prof_mgmt | bool
  notify: Reload ufw Service
